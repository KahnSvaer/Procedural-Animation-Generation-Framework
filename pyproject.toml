    { url = "https://github.com/MiroPsota/torch_packages_builder/releases/download/pytorch3d-0.7.9/pytorch3d-0.7.9+pt2.6.0cu124-cp313-cp313-linux_x86_64.whl", marker = "python_version == '3.13'" }
]