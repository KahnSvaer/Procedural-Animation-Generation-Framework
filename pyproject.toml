[project]
name = "animationgenerationgsoc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.13.0",
    "numpy>=1.26.4,<2.0.0",
    "opencv-python>=4.10.0,<4.12.0",
    "pillow>=12.2.0",
    "pyrender>=0.1.45",
    "python-dotenv>=1.2.2",
    "rembg[gpu]>=2.0.50,<2.0.70",
    "pymatting==1.1.15",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers>=5.9.0",
    "trimesh[easy]>=4.12.2",
    "open3d>=0.19.0",
    "pymeshlab>=2025.7.post1",
    "igraph>=1.0.0",
    "jaxtyping>=0.3.11",
    "triangle>=20250106",
    "scipy>=1.13.0,<1.15.0",
    "pygltflib>=1.16.5",
]

[tool.setuptools]
packages = ["animgen"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[dependency-groups]
dev = [
    "beartype>=0.22.9",
    "bpy>=4.4.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.0",
    "plotly>=6.0.0",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyvista>=0.48.4",
    "ruff>=0.15.20",
]

[tool.ruff]
exclude = [
    "experiments/",
    "demo",
]

[tool.pyright]
include = ["animgen", "tests"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
    "experiments/",
    "demo",
]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:tostring\\(\\) is deprecated:DeprecationWarning",
]
