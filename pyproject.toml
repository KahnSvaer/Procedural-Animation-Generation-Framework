[project]
name = "animationgenerationgsoc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "numpy>=2.0.0",
    "opencv-python>=4.12.0",
    "pillow>=12.2.0",
    "pyrender>=0.1.45",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "rembg[gpu]>=2.0.75",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers>=5.9.0",
    "trimesh>=4.12.2",
    "pytorch3d==0.7.9"
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

pytorch3d = [
    { url = "https://github.com/MiroPsota/torch_packages_builder/releases/download/pytorch3d-0.7.9/pytorch3d-0.7.9+pt2.6.0cu124-cp311-cp311-linux_x86_64.whl", marker = "python_version == '3.11'" },
